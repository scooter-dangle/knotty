<!doctype html>
<html>
  <head>
    <meta charset="utf-8">

    <style>
      input.select-move[disabled] {
        border-color: #b8a0a0;
        background-color: #a0a0a0;
      }

      button.snapshot[disabled] {
        border-color: #b8a0a0;
        background-color: #a0a0a0;
      }

      .snapshot-catalog {
        margin-top: 8px;
      }

      .snapshot-entry {
        border: 1px solid #ccc;
        padding: 4px;
        margin: 4px 0;
      }

      .snapshot-preview svg {
        width: 150px;
        height: 150px;
      }

      .manual-input {
        font-family: monospace;
        white-space: pre;
      }

      /* Marks a picture that no longer matches the text being edited. */
      .manual-render.stale {
        opacity: 0.4;
      }

      .manual-error {
        color: #a02020;
      }

      .symbol-table code {
        font-size: 1.2em;
      }

      .symbol-table td {
        padding-right: 12px;
      }

      .compact-text pre {
        font-size: 0.9em;
      }
    </style>

    <title>Oh Baby, Make It Knot So Good</title>
  </head>
  <body></body>
</html>
