[package]
name = "knot-so-good"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
yew = { version = "0.23", features = ["csr"] }
knotty = { path = "../../../knotty" }
wasm-bindgen = "0.2.83"
web-sys = "0.3.60"
js-sys = "0.3.60"
svgbob = "0.6.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
